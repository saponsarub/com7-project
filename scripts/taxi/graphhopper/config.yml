# GraphHopper (road routing on our own machine) — snaps EV7 taxi GPS traces to real roads at build time
#
# Files live outside the repo (large / downloadable):
#   D:\Taxi\graphhopper\graphhopper-web-11.1.jar      https://repo1.maven.org/maven2/com/graphhopper/graphhopper-web/11.1/
#   D:\Taxi\graphhopper\thailand-latest.osm.pbf        https://download.geofabrik.de/asia/thailand-latest.osm.pbf  (OpenStreetMap, ODbL)
#   D:\Taxi\graphhopper\graph-cache\                   built on first start (import ~10–20 min, ~2 GB)
#
# Run (Java 17+, no admin, no Docker):
#   cd D:\Taxi\graphhopper
#   java -Xmx5g -jar graphhopper-web-11.1.jar server C:\Projects\my-first-project\scripts\taxi\graphhopper\config.yml
#   → http://localhost:8989/route  (only this machine — bind_host: localhost)
# Re-import after a new .pbf: delete graph-cache\ and start again.

graphhopper:
  datareader.file: thailand-latest.osm.pbf
  graph.location: graph-cache

  # cars only — taxis never use footways / cycleways
  import.osm.ignored_highways: footway,cycleway,path,pedestrian,steps,bridleway,corridor
  graph.encoded_values: car_access, car_average_speed, road_access, road_class, max_speed

  profiles:
    - name: car
      custom_model_files: [car.json]

  # CH = fast routing through many waypoints (build step routes ~4,000 traces)
  profiles_ch:
    - profile: car
  profiles_lm: []

  prepare.min_network_size: 200
  prepare.subnetworks.threads: 2
  routing.non_ch.max_waypoint_distance: 1000000
  routing.max_visited_nodes: 1000000
  graph.dataaccess.default_type: RAM_STORE

server:
  application_connectors:
    - type: http
      port: 8989
      bind_host: localhost
  request_log:
    appenders: []
  admin_connectors:
    - type: http
      port: 8990
      bind_host: localhost

logging:
  appenders:
    - type: console
      threshold: INFO
      log_format: "%d{HH:mm:ss} %-5p %c{0}: %m%n"
