<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<style>
  :root {
    --color-bg: #ffffff;
    --color-bg-secondary: #f4f5f7;
    --color-text: #172b4d;
    --color-text-secondary: #44546f;
    --color-text-muted: #8993a4;
    --color-border-light: #ebecf0;
    --color-border: #dfe1e6;
    --color-surface: #ffffff;
    --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --font-mono: 'SF Mono', Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { 
    background: var(--color-bg); 
    font-family: var(--font-sans); 
    color: var(--color-text);
    overflow: hidden;
    width: 100vw; height: 100vh;
  }
  #app { display: flex; height: 100vh; }
  
  /* Sidebar */
  #sidebar {
    width: 280px; min-width: 280px;
    background: var(--color-bg-secondary);
    border-right: 1px solid var(--color-border);
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  #sidebar-header {
    padding: 16px;
    border-bottom: 1px solid var(--color-border-light);
  }
  #sidebar-header h2 {
    font-size: 15px; font-weight: 600; margin-bottom: 10px;
  }
  #search-input {
    width: 100%; padding: 8px 12px;
    border: 1px solid var(--color-border);
    border-radius: 6px; font-size: 13px;
    background: var(--color-surface);
    color: var(--color-text);
    outline: none;
  }
  #search-input:focus { border-color: #0052CC; }
  
  /* Category filters */
  #cat-filters {
    padding: 12px 16px;
    border-bottom: 1px solid var(--color-border-light);
    display: flex; flex-wrap: wrap; gap: 4px;
  }
  .cat-btn {
    font-size: 11px; padding: 3px 8px;
    border-radius: 100px;
    border: 1px solid var(--color-border);
    background: var(--color-surface);
    color: var(--color-text-secondary);
    cursor: pointer; transition: all 0.15s;
    white-space: nowrap;
  }
  .cat-btn:hover { background: var(--color-bg-secondary); }
  .cat-btn.active { border-color: currentColor; font-weight: 600; }
  
  /* Entity list */
  #entity-list {
    flex: 1; overflow-y: auto; padding: 8px;
  }
  .entity-item {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 10px; border-radius: 6px;
    cursor: pointer; font-size: 12px;
    transition: background 0.1s;
  }
  .entity-item:hover { background: var(--color-surface); }
  .entity-item.selected { background: #e6f0ff; }
  .entity-dot {
    width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
  }
  .entity-name {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .entity-count {
    margin-left: auto; font-size: 10px; color: var(--color-text-muted);
    font-family: var(--font-mono);
  }
  
  /* Stats bar */
  #stats-bar {
    padding: 10px 16px;
    border-top: 1px solid var(--color-border-light);
    font-size: 11px; color: var(--color-text-muted);
    display: flex; gap: 12px;
  }
  #stats-bar span { font-family: var(--font-mono); }
  
  /* Graph area */
  #graph-area { flex: 1; position: relative; }
  #graph-svg { width: 100%; height: 100%; }
  
  /* Tooltip */
  #tooltip {
    position: fixed; 
    pointer-events: none;
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: 8px;
    padding: 12px 16px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.12);
    font-size: 12px;
    max-width: 300px;
    z-index: 100;
    opacity: 0;
    transition: opacity 0.15s;
  }
  #tooltip.show { opacity: 1; }
  #tooltip h3 { font-size: 14px; margin-bottom: 4px; }
  #tooltip .cat-tag {
    display: inline-block; font-size: 10px;
    padding: 2px 6px; border-radius: 100px;
    margin-bottom: 6px;
  }
  #tooltip .connections {
    color: var(--color-text-secondary);
    font-size: 11px;
  }
  
  /* Detail panel */
  #detail-panel {
    position: absolute; top: 16px; right: 16px;
    width: 300px;
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: 10px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    z-index: 50;
    display: none;
    max-height: calc(100vh - 32px);
    overflow-y: auto;
  }
  #detail-panel.show { display: block; }
  #detail-header {
    padding: 16px; 
    border-bottom: 1px solid var(--color-border-light);
    display: flex; align-items: flex-start; justify-content: space-between;
  }
  #detail-close {
    background: none; border: none; cursor: pointer;
    font-size: 18px; color: var(--color-text-muted);
    padding: 0 4px;
  }
  #detail-connections {
    padding: 12px 16px;
  }
  .conn-item {
    display: flex; align-items: center; gap: 6px;
    padding: 5px 0; font-size: 12px;
    cursor: pointer;
    border-bottom: 1px solid var(--color-border-light);
  }
  .conn-item:hover { color: #0052CC; }
  .conn-rel {
    font-size: 10px; color: var(--color-text-muted);
    background: var(--color-bg-secondary);
    padding: 1px 5px; border-radius: 3px;
    font-family: var(--font-mono);
  }
  
  /* Legend */
  #legend {
    position: absolute; bottom: 16px; left: 16px;
    background: var(--color-surface);
    border: 1px solid var(--color-border-light);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 11px;
    display: flex; flex-wrap: wrap; gap: 8px;
    z-index: 10;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }
  .legend-item { display: flex; align-items: center; gap: 4px; }
  .legend-dot { width: 8px; height: 8px; border-radius: 50%; }
</style>
</head>

<div id="app">

    <div id="sidebar-header">

    <div id="cat-filters"></div>
    <div id="entity-list"></div>
    <div id="stats-bar">

  <div id="graph-area">

    <div id="tooltip"></div>
    <div id="detail-panel">
      <div id="detail-header">
        <div id="detail-info"></div>
        <button id="detail-close">&times;</button>
      </div>
      <div id="detail-connections"></div>
    </div>
    <div id="legend"></div>

</div>

  Service: 5, Dataset: 4, CreativeWork: 5, DefinedTerm: 4,
  Decision: 5, Event: 6, Instruction: 5,
};

// Prepare data
const nodes = DATA.nodes.map(n => ({
  ...n,
  color: CAT_COLORS[n.cat] || '#8993a4',
  radius: CAT_SIZES[n.cat] || 4,
  degree: 0,
}));

const nodeMap = new Map(nodes.map(n => [n.id, n]));

const edges = DATA.edges.filter(e => nodeMap.has(e.s) && nodeMap.has(e.t)).map(e => ({
  source: e.s, target: e.t, relation: e.r
}));

// Count degrees
edges.forEach(e => {
  const s = nodeMap.get(e.source);
  const t = nodeMap.get(e.target);
  if (s) s.degree++;
  if (t) t.degree++;
});

// Scale radius by degree
nodes.forEach(n => {
  n.radius = Math.max(n.radius, 3 + Math.sqrt(n.degree) * 1.5);
});

// --- D3 Force Graph ---
const svg = d3.select('#graph-svg');
const width = document.getElementById('graph-area').clientWidth;
const height = document.getElementById('graph-area').clientHeight;

const g = svg.append('g');

// Zoom
const zoom = d3.zoom()
  .scaleExtent([0.1, 8])
  .on('zoom', (event) => g.attr('transform', event.transform));
svg.call(zoom);

// Simulation
const simulation = d3.forceSimulation(nodes)
  .force('link', d3.forceLink(edges).id(d => d.id).distance(60).strength(0.3))
  .force('charge', d3.forceManyBody().strength(-80).distanceMax(300))
  .force('center', d3.forceCenter(width / 2, height / 2))
  .force('collision', d3.forceCollide().radius(d => d.radius + 2))
  .force('x', d3.forceX(width / 2).strength(0.03))
  .force('y', d3.forceY(height / 2).strength(0.03));

// Draw edges
const linkG = g.append('g').attr('class', 'links');
const link = linkG.selectAll('line')
  .data(edges).enter().append('line')
  .attr('stroke', 'var(--color-border)')
  .attr('stroke-opacity', 0.3)
  .attr('stroke-width', 0.5);

// Draw nodes
const nodeG = g.append('g').attr('class', 'nodes');
const node = nodeG.selectAll('circle')
  .data(nodes).enter().append('circle')
  .attr('r', d => d.radius)
  .attr('fill', d => d.color)
  .attr('stroke', '#fff')
  .attr('stroke-width', 0.5)
  .attr('cursor', 'pointer')
  .call(d3.drag()
    .on('start', dragStart)
    .on('drag', dragging)
    .on('end', dragEnd));

// Labels for high-degree nodes
const labelG = g.append('g').attr('class', 'labels');
const label = labelG.selectAll('text')
  .data(nodes.filter(n => n.degree >= 6))
  .enter().append('text')
  .attr('font-size', '9px')
  .attr('fill', 'var(--color-text-secondary)')
  .attr('text-anchor', 'middle')
  .attr('dy', d => -d.radius - 3)
  .attr('pointer-events', 'none')
  .text(d => d.name.length > 25 ? d.name.slice(0, 22) + '...' : d.name);

simulation.on('tick', () => {
  link
    .attr('x1', d => d.source.x).attr('y1', d => d.source.y)
    .attr('x2', d => d.target.x).attr('y2', d => d.target.y);
  node.attr('cx', d => d.x).attr('cy', d => d.y);
  label.attr('x', d => d.x).attr('y', d => d.y);
});

// --- Interactions ---
const tooltip = document.getElementById('tooltip');
const detailPanel = document.getElementById('detail-panel');

node.on('mouseover', function(event, d) {
  const conns = edges.filter(e => 
    (e.source.id || e.source) === d.id || (e.target.id || e.target) === d.id
  ).length;
  tooltip.innerHTML = '<h3>' + d.name + '</h3>'
    + '<div class="cat-tag" style="background:' + d.color + '20;color:' + d.color + '">' + d.cat + '</div>'
    + '<div class="connections">' + conns + ' connections</div>';
  tooltip.classList.add('show');
  tooltip.style.left = (event.clientX + 12) + 'px';
  tooltip.style.top = (event.clientY - 10) + 'px';
  
  // Highlight connected
  const connIds = new Set();
  connIds.add(d.id);
  edges.forEach(e => {
    const sid = e.source.id || e.source;
    const tid = e.target.id || e.target;
    if (sid === d.id) connIds.add(tid);
    if (tid === d.id) connIds.add(sid);
  });
  node.attr('opacity', n => connIds.has(n.id) ? 1 : 0.1);
  link.attr('stroke-opacity', e => {
    const sid = e.source.id || e.source;
    const tid = e.target.id || e.target;
    return (sid === d.id || tid === d.id) ? 0.6 : 0.03;
  }).attr('stroke-width', e => {
    const sid = e.source.id || e.source;
    const tid = e.target.id || e.target;
    return (sid === d.id || tid === d.id) ? 1.5 : 0.5;
  }).attr('stroke', e => {
    const sid = e.source.id || e.source;
    const tid = e.target.id || e.target;
    return (sid === d.id || tid === d.id) ? d.color : 'var(--color-border)';
  });
  label.attr('opacity', n => connIds.has(n.id) ? 1 : 0.1);
  
  d3.select(this).attr('stroke', d.color).attr('stroke-width', 2);
})
.on('mousemove', function(event) {
  tooltip.style.left = (event.clientX + 12) + 'px';
  tooltip.style.top = (event.clientY - 10) + 'px';
})
.on('mouseout', function() {
  tooltip.classList.remove('show');
  node.attr('opacity', 1);
  link.attr('stroke-opacity', 0.3).attr('stroke-width', 0.5).attr('stroke', 'var(--color-border)');
  label.attr('opacity', 1);
  d3.select(this).attr('stroke', '#fff').attr('stroke-width', 0.5);
})
.on('click', function(event, d) {
  showDetail(d);
  event.stopPropagation();
});

svg.on('click', () => { detailPanel.classList.remove('show'); });

function showDetail(d) {
  const conns = [];
  edges.forEach(e => {
    const sid = e.source.id || e.source;
    const tid = e.target.id || e.target;
    if (sid === d.id) {
      const t = nodeMap.get(tid);
      if (t) conns.push({ node: t, rel: e.relation, dir: '→' });
    }
    if (tid === d.id) {
      const s = nodeMap.get(sid);
      if (s) conns.push({ node: s, rel: e.relation, dir: '←' });
    }
  });
  
  document.getElementById('detail-info').innerHTML = 
    '<h3 style="font-size:15px;margin-bottom:4px">' + d.name + '</h3>'
    + '<div class="cat-tag" style="background:' + d.color + '20;color:' + d.color + ';display:inline-block;font-size:11px;padding:2px 8px;border-radius:100px">' + d.cat + '</div>'
    + '<div style="color:var(--color-text-muted);font-size:12px;margin-top:6px">' + conns.length + ' connections</div>';
  
  const connHtml = conns.sort((a,b) => a.rel.localeCompare(b.rel))
    .map(c => '<div class="conn-item" data-id="' + c.node.id + '">'
      + '<span class="entity-dot" style="background:' + c.node.color + '"></span>'
      + '<span>' + c.node.name + '</span>'
      + '<span class="conn-rel">' + c.dir + ' ' + c.rel + '</span></div>').join('');
  document.getElementById('detail-connections').innerHTML = connHtml;
  
  // Click on connections to navigate
  document.querySelectorAll('.conn-item').forEach(el => {
    el.addEventListener('click', () => {
      const targetNode = nodeMap.get(el.dataset.id);
      if (targetNode) {
        showDetail(targetNode);
        // Center on node
        const t = d3.zoomIdentity.translate(width/2 - targetNode.x, height/2 - targetNode.y);
        svg.transition().duration(500).call(zoom.transform, t);
      }
    });
  });
  
  detailPanel.classList.add('show');
  
  // Highlight this node and connected in sidebar
  document.querySelectorAll('.entity-item').forEach(el => {
    el.classList.toggle('selected', el.dataset.id === d.id);
  });
}

document.getElementById('detail-close').addEventListener('click', () => {
  detailPanel.classList.remove('show');
});

// --- Sidebar ---
// Category filters
const categories = [...new Set(nodes.map(n => n.cat))].sort();
const catCounts = {};
nodes.forEach(n => { catCounts[n.cat] = (catCounts[n.cat] || 0) + 1; });

let activeCats = new Set(categories);
const catFilters = document.getElementById('cat-filters');

const allBtn = document.createElement('button');
allBtn.className = 'cat-btn active';
allBtn.textContent = 'All ' + nodes.length;
allBtn.addEventListener('click', () => {
  activeCats = new Set(categories);
  updateFilters();
});
catFilters.appendChild(allBtn);

categories.forEach(cat => {
  const btn = document.createElement('button');
  btn.className = 'cat-btn active';
  btn.style.color = CAT_COLORS[cat] || '#666';
  btn.textContent = cat + ' ' + catCounts[cat];
  btn.addEventListener('click', () => {
    if (activeCats.has(cat)) activeCats.delete(cat);
    else activeCats.add(cat);
    updateFilters();
  });
  catFilters.appendChild(btn);
});

function updateFilters() {
  document.querySelectorAll('.cat-btn').forEach((btn, i) => {
    if (i === 0) {
      btn.classList.toggle('active', activeCats.size === categories.length);
    } else {
      const cat = categories[i - 1];
      btn.classList.toggle('active', activeCats.has(cat));
    }
  });
  
  node.attr('opacity', d => activeCats.has(d.cat) ? 1 : 0.05)
      .attr('pointer-events', d => activeCats.has(d.cat) ? 'all' : 'none');
  link.attr('stroke-opacity', e => {
    const s = nodeMap.get(e.source.id || e.source);
    const t = nodeMap.get(e.target.id || e.target);
    return (s && activeCats.has(s.cat) && t && activeCats.has(t.cat)) ? 0.3 : 0.02;
  });
  label.attr('opacity', d => activeCats.has(d.cat) ? 1 : 0.05);
  
  renderEntityList();
}

// Entity list
function renderEntityList(filter = '') {
  const list = document.getElementById('entity-list');
  const filtered = nodes
    .filter(n => activeCats.has(n.cat))
    .filter(n => !filter || n.name.toLowerCase().includes(filter.toLowerCase()))
    .sort((a, b) => b.degree - a.degree);
  
  list.innerHTML = filtered.slice(0, 200).map(n => 
    '<div class="entity-item" data-id="' + n.id + '">'
    + '<span class="entity-dot" style="background:' + n.color + '"></span>'
    + '<span class="entity-name">' + n.name + '</span>'
    + '<span class="entity-count">' + n.degree + '</span>'
    + '</div>'
  ).join('');
  
  list.querySelectorAll('.entity-item').forEach(el => {
    el.addEventListener('click', () => {
      const nd = nodeMap.get(el.dataset.id);
      if (nd) {
        showDetail(nd);
        const scale = 2;
        const t = d3.zoomIdentity.translate(width/2, height/2).scale(scale).translate(-nd.x, -nd.y);
        svg.transition().duration(500).call(zoom.transform, t);
      }
    });
  });
  
  document.getElementById('stat-nodes').textContent = filtered.length;
  document.getElementById('stat-edges').textContent = edges.filter(e => {
    const s = nodeMap.get(e.source.id || e.source);
    const t = nodeMap.get(e.target.id || e.target);
    return s && t && activeCats.has(s.cat) && activeCats.has(t.cat);
  }).length;
}

document.getElementById('search-input').addEventListener('input', (e) => {
  renderEntityList(e.target.value);
  
  // Highlight matching nodes
  const q = e.target.value.toLowerCase();
  if (q) {
    node.attr('opacity', d => d.name.toLowerCase().includes(q) ? 1 : 0.1);
    label.attr('opacity', d => d.name.toLowerCase().includes(q) ? 1 : 0.1);
  } else {
    node.attr('opacity', d => activeCats.has(d.cat) ? 1 : 0.05);
    label.attr('opacity', d => activeCats.has(d.cat) ? 1 : 0.05);
  }
});

// Legend
const legendEl = document.getElementById('legend');
categories.forEach(cat => {
  legendEl.innerHTML += '<div class="legend-item"><span class="legend-dot" style="background:' 
    + (CAT_COLORS[cat] || '#8993a4') + '"></span>' + cat + '</div>';
});

// Drag
function dragStart(event, d) {
  if (!event.active) simulation.alphaTarget(0.3).restart();
  d.fx = d.x; d.fy = d.y;
}
function dragging(event, d) { d.fx = event.x; d.fy = event.y; }
function dragEnd(event, d) {
  if (!event.active) simulation.alphaTarget(0);
  d.fx = null; d.fy = null;
}

// Initial render
renderEntityList();
</script>
</body>
</html>
